<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a231c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Every Grateful Dead show, 1965–1995. Setlists, streams, and a time machine.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dead Time Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@400;500;600&family=Piedra&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --black:#090909;--panel:#141414;--card:#181818;--border:#252525;--subtle:#2e2e2e;
  --gold:#C9943A;--amber:#E8A820;--cream:#EDE5D5;
  --dim:#8b8478;--faint:#5c574e;
  --teal:#3AA08C;--purple:#8A62BC;--crimson:#C24A4A;
  /* header surfaces — deliberately lighter than the body so headers read as paper, not void */
  --hdr-a:#3d342a;--hdr-b:#2a231c;--hdr-c:#1d1815;--hdr-line:#50432f;
  --nav-bg:rgba(42,35,28,.9);--sheet:#241f19;--sheet-2:#2e2721;
  --font-display:'Cinzel',serif;--font-body:'Barlow',sans-serif;--font-ui:'Barlow Condensed',sans-serif;
  --font-wm:'Piedra',var(--font-display);
  --t:.22s cubic-bezier(.4,0,.2,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}

html{height:100%;background:var(--black)}

body{min-height:100%;background:var(--black);color:var(--cream);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* VIEWS */
.view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--black);transition:opacity var(--t),transform var(--t);will-change:transform,opacity;z-index:1}
.view.r{transform:translateX(100%);opacity:0;pointer-events:none}
.view.l{transform:translateX(-28%);opacity:0;pointer-events:none}

/* NAV BAR — compact, lit warm so it sits above the black body */
.nav{position:sticky;top:0;z-index:20;background:var(--nav-bg);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--hdr-line);padding:var(--safe-t) 14px 0;height:calc(46px + var(--safe-t));display:flex;align-items:center;gap:8px}
.back{background:none;border:none;color:var(--amber);font-size:24px;cursor:pointer;padding:6px 10px 6px 0;flex-shrink:0;font-family:var(--font-ui);line-height:1}
.nav-txt{min-width:0;flex:1}
.nav-t{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.nav-s{font-family:var(--font-ui);font-size:11px;color:#a1968a;letter-spacing:1px;line-height:1.2}

/* HOME */
#home{padding-bottom:calc(72px + var(--safe-b))}

/* HERO — one compact band: the wordmark and a single line of context */
.hero{padding:calc(12px + var(--safe-t)) 16px 11px;text-align:center;border-bottom:1px solid var(--hdr-line);background:linear-gradient(172deg,var(--hdr-a) 0%,var(--hdr-b) 56%,var(--hdr-c) 100%);position:relative;overflow:hidden}
.hero-art{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% 128%,rgba(232,168,32,.20),transparent 62%),
  radial-gradient(ellipse at 12% 0%,rgba(138,98,188,.14),transparent 55%),
  radial-gradient(ellipse at 90% 8%,rgba(58,160,140,.12),transparent 52%)}
.hero>*{position:relative}
.wordmark{display:block;width:100%;max-width:290px;height:auto;margin:0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
.wordmark text{font-family:var(--font-wm)}
.hero-sub{font-family:var(--font-ui);font-weight:500;font-size:11px;color:#b3a696;letter-spacing:2.6px;text-transform:uppercase;margin-top:6px}
.hero-sub b{color:var(--amber);font-weight:600}

/* SECTION HEADERS */
.sec{padding:28px 16px 0}
.sec-eye{font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-eye::after{content:'';flex:1;height:1px;background:var(--border)}

/* SHOW OF DAY CARD */
.sotd{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.sotd::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--era-color,var(--gold));z-index:1}
.sotd:active{background:#1d1d1d}
.sotd-in{padding:18px 18px 16px 22px;position:relative}
.sotd-date{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--cream);font-variant-numeric:tabular-nums}
.sotd-dow{font-family:var(--font-ui);font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
.sotd-venue{font-size:15px;color:#c2baa8;margin-top:10px;line-height:1.3;font-weight:400}
.sotd-city{font-family:var(--font-ui);font-size:13px;color:var(--teal);letter-spacing:.5px;margin-top:4px}
.sotd-era{font-family:var(--font-ui);font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:1px}
.sotd-songs{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.sotd-song{font-size:14px;color:var(--cream);font-weight:400;line-height:1.5}
.sotd-song.hi{color:var(--amber);font-weight:500}
.sotd-more{font-family:var(--font-ui);font-size:11px;color:var(--dim);letter-spacing:1px;margin-top:4px}
.sotd-ft{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 12px 22px;border-top:1px solid var(--border);background:var(--panel)}
.sotd-src{font-family:var(--font-ui);font-size:10px;color:var(--faint);letter-spacing:.5px}
.sotd-listen{font-family:var(--font-ui);font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;text-decoration:none}
.sk{height:220px;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-size:12px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* RANDOM BUTTON */
.rand-wrap{padding:16px 16px 0}
.rand-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(201,148,58,.08);border:1px solid rgba(201,148,58,.35);border-radius:10px;padding:14px;cursor:pointer;transition:background var(--t)}
.rand-btn:active{background:rgba(201,148,58,.2)}
.rand-btn .bolt{color:var(--amber);font-size:16px}
.rand-btn span{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase}

/* TABS */
.browse{margin-top:6px}
.tabs{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--border);margin-top:14px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-family:var(--font-ui);font-size:13px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;padding:12px 14px;cursor:pointer;transition:color var(--t)}
.tab.on{color:var(--cream);border-bottom-color:var(--gold)}
.tp{display:none}
.tp.on{display:block}

/* SEARCH */
.srch-wrap{padding:14px 16px 4px}
.srch-box{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--subtle);border-radius:8px;padding:0 14px}
.srch-box:focus-within{border-color:var(--gold)}
.srch-box .mag{color:var(--dim);font-size:15px}
.srch-in{flex:1;background:none;border:none;outline:none;color:var(--cream);font-family:var(--font-body);font-size:16px;padding:12px 0}
.srch-in::placeholder{color:var(--faint)}
.srch-hint{font-family:var(--font-ui);font-size:11px;color:var(--faint);letter-spacing:.5px;padding:10px 18px 0}
.sh-match{font-family:var(--font-ui);font-size:12px;color:var(--amber);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ERA LIST */
.era-row{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;transition:background var(--t)}
.era-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--era-color)}
.era-row::after{content:'';position:absolute;right:-30px;top:50%;width:190px;height:190px;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,var(--era-color) 0%,transparent 65%);opacity:.13;pointer-events:none}
.era-row:active{background:var(--panel)}
.era-in{position:relative}
.era-name{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--cream)}
.era-yrs{font-family:var(--font-ui);font-size:12px;color:var(--dim);letter-spacing:1px;margin-top:3px}
.era-r{display:flex;align-items:center;gap:10px;position:relative}
.era-cnt{font-family:var(--font-ui);font-size:12px;color:var(--dim)}
.era-chev{color:var(--faint);font-size:20px;font-family:var(--font-ui)}

/* YEAR GRID */
.yr-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;padding-top:1px}
.yr-btn{background:var(--panel);border:none;border-bottom:1px solid var(--border);cursor:pointer;padding:13px 6px;text-align:center;transition:background var(--t)}
.yr-btn:active{background:#1d1d1d}
.yr-n{font-family:var(--font-display);font-size:14px;color:var(--cream);display:block;font-weight:700}
.yr-c{font-family:var(--font-ui);font-size:10px;color:var(--dim);letter-spacing:.5px;display:block;margin-top:2px}

.home-ft{padding:32px 20px 0;text-align:center}
.home-ft p{font-family:var(--font-ui);font-size:11px;color:var(--faint);letter-spacing:.5px;line-height:1.9}
.home-ft a{color:var(--gold);text-decoration:none}

/* LIST VIEW */
.show-row{display:flex;align-items:flex-start;padding:0 16px;border-bottom:1px solid var(--border);cursor:pointer;min-height:72px;transition:background var(--t)}
.show-row:active{background:var(--panel)}
.dt-col{padding:14px 14px 14px 0;border-right:1px solid var(--subtle);margin-right:14px;flex-shrink:0;text-align:right;width:50px}
.dt-m{font-family:var(--font-ui);font-size:10px;font-weight:500;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;display:block}
.dt-d{font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--cream);line-height:1.1;font-variant-numeric:tabular-nums}
.dt-y{font-family:var(--font-ui);font-size:10px;color:var(--dim);display:block}
.sh-info{padding:13px 0;flex:1;min-width:0}
.sh-venue{font-size:15px;color:var(--cream);font-weight:400;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-city{font-family:var(--font-ui);font-size:12px;color:var(--teal);margin-top:3px}
.sh-badge{font-family:var(--font-ui);font-size:11px;color:var(--crimson);margin-top:3px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-chev{font-family:var(--font-ui);font-size:18px;color:var(--subtle);padding:14px 0 14px 8px;align-self:center;flex-shrink:0}

/* SHOW DETAIL */
.show-hero{padding:15px 18px 16px;border-bottom:1px solid var(--hdr-line);position:relative;background:linear-gradient(172deg,var(--hdr-a) 0%,var(--hdr-b) 52%,var(--hdr-c) 100%);overflow:hidden}
.show-hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--era-color,var(--gold));z-index:2}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity .6s ease;z-index:0}
.hero-photo.on{opacity:.5}
.hero-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,24,21,.2) 0%,rgba(29,24,21,.72) 74%,var(--hdr-c) 100%)}
.hero-tint{position:absolute;inset:0;z-index:0;opacity:.5;background:radial-gradient(circle at 80% 10%,var(--era-color,var(--gold)) 0%,transparent 52%);mix-blend-mode:overlay}
.show-hero>.sh-c{position:relative;z-index:1}
.photo-cred{position:absolute;right:10px;bottom:8px;z-index:3;font-family:var(--font-ui);font-size:10px;letter-spacing:.5px;color:rgba(237,229,213,.55);text-decoration:none;background:rgba(9,9,9,.5);padding:2px 7px;border-radius:4px;opacity:0;transition:opacity .6s ease}
.photo-cred.on{opacity:1}
.sh-date{font-family:var(--font-display);font-size:clamp(19px,5.2vw,26px);font-weight:900;color:var(--cream);font-variant-numeric:tabular-nums;line-height:1.15}
.sh-dow{font-family:var(--font-ui);font-size:12px;color:var(--amber);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.sh-venue-big{font-size:17px;color:var(--cream);margin-top:9px;line-height:1.3;font-weight:400}
.sh-city-big{font-family:var(--font-ui);font-size:14px;color:#5cc4ad;margin-top:3px;letter-spacing:.5px}
.sh-era-lbl{font-family:var(--font-ui);font-size:11px;color:#a1968a;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase}
.sh-badge-big{display:inline-block;margin-top:8px;background:rgba(194,74,74,.13);border:1px solid rgba(194,74,74,.35);border-radius:4px;padding:4px 10px;font-family:var(--font-ui);font-size:11px;color:#e07a7a;letter-spacing:.5px}

/* venue guide trigger */
.venue-btn{display:inline-flex;align-items:center;gap:7px;margin-top:11px;background:rgba(252,237,203,.1);border:1px solid rgba(232,168,32,.42);border-radius:20px;padding:7px 14px;cursor:pointer;font-family:var(--font-ui);font-size:12px;font-weight:500;color:#F4C866;letter-spacing:1.4px;text-transform:uppercase;transition:background var(--t)}
.venue-btn:active{background:rgba(232,168,32,.24)}
.venue-btn .vb-i{font-size:13px;line-height:1}
.nav-act{background:none;border:none;color:var(--amber);font-size:19px;cursor:pointer;padding:8px 2px 8px 10px;flex-shrink:0;line-height:1}

/* PLAYER */
.player-blk{margin:18px 20px 0}
.play-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(201,148,58,.12);border:1px solid rgba(201,148,58,.4);border-radius:10px;padding:15px;cursor:pointer;transition:background var(--t)}
.play-btn:active{background:rgba(201,148,58,.22)}
.play-btn .tri{color:var(--amber);font-size:14px}
.play-btn span{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase}
.play-btn[disabled]{opacity:.55;pointer-events:none}
.player-frame{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#000}
.player-frame iframe{display:block;width:100%;height:340px;border:0}
.player-meta{font-family:var(--font-ui);font-size:11px;color:var(--dim);letter-spacing:.5px;margin-top:8px;line-height:1.6}
.player-meta a{color:var(--gold);text-decoration:none}
.player-err{font-family:var(--font-ui);font-size:12px;color:var(--dim);letter-spacing:.5px;margin-top:10px;line-height:1.6}
.player-err a{color:var(--gold)}

.setlist-wrap{padding-bottom:calc(80px + var(--safe-b))}
.set-block{padding:20px 20px 0}
.set-lbl{font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);padding-bottom:10px;border-bottom:1px solid var(--subtle);margin-bottom:2px}
.set-lbl.enc{color:var(--purple)}

.song-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid #1a1a1a}
.song-row:last-child{border-bottom:none}
.song-row.tapd{cursor:pointer;transition:background var(--t)}
.song-row.tapd:active{background:rgba(255,255,255,.045)}
.sx{font-family:var(--font-ui);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:26px;text-align:right}
.tag{display:inline-block;font-family:var(--font-ui);font-size:9.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.tag.debut{background:rgba(58,160,140,.16);color:#5cc4ad;border:1px solid rgba(58,160,140,.4)}
.tag.last{background:rgba(194,74,74,.15);color:#e07a7a;border:1px solid rgba(194,74,74,.4)}
.tag.only{background:rgba(138,98,188,.18);color:#cdbce6;border:1px solid rgba(138,98,188,.45)}
.tag.bust{background:rgba(232,168,32,.15);color:var(--amber);border:1px solid rgba(232,168,32,.42)}

/* SHOW CONTEXT + LINEUP */
.sh-ctx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sh-ctx span{font-family:var(--font-ui);font-size:11px;color:#d8cdb9;letter-spacing:.9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:4px;padding:3px 8px}
.band-blk{margin:16px 20px 0;padding:13px 15px;background:var(--panel);border:1px solid var(--border);border-radius:9px}
.band-lbl{font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.band-list{display:flex;flex-wrap:wrap;gap:6px}
.band-m{font-size:13px;color:#ded4c1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px 10px;line-height:1.3}
.band-m b{font-family:var(--font-ui);font-weight:400;font-size:10.5px;color:var(--dim);letter-spacing:.5px;margin-left:5px}
.band-note{font-family:var(--font-ui);font-size:10.5px;color:var(--faint);letter-spacing:.4px;margin-top:9px;line-height:1.5}

/* RECORDINGS */
.rec-blk{padding:22px 20px 0}
.set-lbl.rec{color:var(--teal)}
.rec-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1a1a1a;text-decoration:none}
.rec-row:last-of-type{border-bottom:none}
.rec-k{font-family:var(--font-ui);font-size:10px;font-weight:600;letter-spacing:1.2px;padding:3px 6px;border-radius:3px;flex-shrink:0;width:52px;text-align:center;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--border)}
.rec-k.k-sbd{background:rgba(58,160,140,.16);color:#5cc4ad;border-color:rgba(58,160,140,.42)}
.rec-k.k-matrix{background:rgba(232,168,32,.15);color:var(--amber);border-color:rgba(232,168,32,.42)}
.rec-k.k-fm{background:rgba(138,98,188,.16);color:#cdbce6;border-color:rgba(138,98,188,.42)}
.rec-t{flex:1;min-width:0;font-size:13px;color:var(--cream);line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rec-t b{display:block;font-family:var(--font-ui);font-size:10px;font-weight:500;color:var(--gold);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
.rec-m{font-family:var(--font-ui);font-size:11px;color:var(--amber);text-align:right;flex-shrink:0;line-height:1.4}
.rec-m i{display:block;font-style:normal;color:var(--faint);font-size:10px}
.rec-all{display:block;text-align:center;font-family:var(--font-ui);font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;padding:11px 0 2px}
.rec-note,.rec-none{font-family:var(--font-ui);font-size:10.5px;color:var(--faint);letter-spacing:.4px;line-height:1.6;margin-top:10px}
.sus{margin:18px 20px 0;padding:11px 13px;background:rgba(194,74,74,.1);border:1px solid rgba(194,74,74,.34);border-radius:8px;font-family:var(--font-ui);font-size:11.5px;color:#e0a0a0;letter-spacing:.4px;line-height:1.65}
.sn{font-family:var(--font-ui);font-size:11px;color:var(--faint);width:18px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums}
.s{font-size:16px;color:var(--cream);flex:1;line-height:1.35;font-weight:400;letter-spacing:.2px}
.s.hi{color:var(--amber);font-weight:500}
.s.en{color:#ab9bd1;font-style:italic}

.sh-footer{margin:22px 20px 0;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;gap:10px}
.sh-ft-src{font-family:var(--font-ui);font-size:11px;color:var(--faint);letter-spacing:.5px;line-height:1.7}
.sh-ft-btns{display:flex;gap:8px}

<body>

<!-- HOME -->
<div class="view" id="home">
  <header class="hero">
    <div class="hero-art"></div>
    <h1>
      <svg class="wordmark" viewBox="0 0 300 46" role="img" aria-label="Grateful Dead">

          <path id="wm-arc" d="M10,38 Q150,7 290,38" fill="none"/>
          <linearGradient id="wm-fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FCEDCB"/>
            <stop offset="46%" stop-color="#E8A820"/>
            <stop offset="100%" stop-color="#A9661A"/>
          </linearGradient>
        </defs>
        <text font-size="27" letter-spacing="1" text-anchor="middle"
              fill="url(#wm-fill)" stroke="#150d04" stroke-width="2.6" paint-order="stroke">
          <textPath href="#wm-arc" startOffset="50%">GRATEFUL DEAD</textPath>
        </text>
      </svg>
    </h1>
    <p class="hero-sub">The Time Machine · <b>1965–1995</b></p>
  </header>

  <div class="sec">

  </div>

<!-- VENUE STAT GUIDE -->
<div class="sheet-bd" id="sheet-bd"></div>
<section class="sheet" id="venue-sheet" role="dialog" aria-modal="true" aria-labelledby="vs-name" hidden>
  <div class="sheet-grab"></div>
  <div class="sheet-hd">
    <div class="sheet-hd-txt">
      <div class="sheet-eye" id="sheet-eye">Venue Guide</div>
      <div class="sheet-name" id="vs-name"></div>
      <div class="sheet-city" id="vs-city"></div>
    </div>
    <button class="sheet-x" id="sheet-x" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body" id="vs-body"></div>

<script>
// ─── DATA is loaded async from shows-data.json (same ERAS structure the scraper produces) ───
let ERAS = [], ALL = [], YR_MAP = {};

const HI = new Set(["Dark Star","Morning Dew","Terrapin Station","St. Stephen",
  "Unbroken Chain","Eyes Of The World","Scarlet Begonias","Estimated Prophet",
  "Attics Of My Life","So Many Roads","Black Muddy River","China Doll",
  "Death Don't Have No Mercy","He's Gone","Stella Blue","Wharf Rat",
  "Fire On The Mountain","Greatest Story Ever Told","Bird Song"]);
const isHi = s => { for (const h of HI) if (s.includes(h)) return true; return false; };

const MOS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MOL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pd = d => { const [y,m,day] = d.split('-').map(Number); return {y,m,day}; };
const fmtL = d => { const {y,m,day} = pd(d); return `${MOL[m-1]} ${day}, ${y}`; };
const fmtS = d => { const {y,m,day} = pd(d); return `${MOL[m-1].slice(0,3)} ${day}, ${y}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const archUrl = d => `https://archive.org/search?query=collection%3A%22GratefulDead%22+AND+date%3A${d}`;
const slUrl = id => `https://www.setlists.net/?show_id=${id}`;

// ─── VENUE → WIKIPEDIA article (photo lookup at runtime, cached in localStorage) ───
const VENUE_WIKI = {
  "Oakland Coliseum Arena":"Oakland Arena",
  "Winterland Arena":"Winterland Ballroom",
  "The Spectrum":"Spectrum (arena)",
  "Madison Square Garden":"Madison Square Garden",
  "Nassau Coliseum":"Nassau Veterans Memorial Coliseum",
  "Shoreline Amphitheatre":"Shoreline Amphitheatre",
  "Fillmore East":"Fillmore East",
  "Fillmore West":"Fillmore West",
  "Fillmore Auditorium":"The Fillmore",
  "Greek Theater, University Of California":"William Randolph Hearst Greek Theatre",
  "Henry J. Kaiser Convention Center":"Henry J. Kaiser Convention Center",
  "Oakland Auditorium Arena":"Henry J. Kaiser Convention Center",
  "Capital Centre":"Capital Centre",
  "Boston Garden":"Boston Garden",
  "The Omni":"Omni Coliseum",
  "Berkeley Community Theater":"Berkeley Community Theatre",
  "Hampton Coliseum":"Hampton Coliseum",
  "Warfield Theater":"The Warfield",
  "Red Rocks Amphitheater":"Red Rocks Amphitheatre",
  "Alpine Valley Music Theater":"Alpine Valley Music Theatre",
  "Providence Civic Center":"Providence Civic Center",
  "Hartford Civic Center":"Hartford Civic Center",
  "Capitol Theater":"Capitol Theatre (Port Chester, New York)",
  "Uptown Theater":"Uptown Theatre (Chicago)",
  "Boston Music Hall":"Boston Music Hall",
  "Robert F. Kennedy Stadium":"Robert F. Kennedy Memorial Stadium",
  "Barton Hall (Cornell University)":"Barton Hall",
  "Soldier Field":"Soldier Field",
  "Cal Expo Amphitheater":"Cal Expo",
  "Frost Amphitheater":"Frost Amphitheater",
  "Giants Stadium":"Giants Stadium",
  "Autzen Stadium":"Autzen Stadium",
  "Irvine Meadows Ampitheatre":"Irvine Meadows Amphitheatre",
  "Deer Creek Music Center":"Deer Creek Music Center"
};

async function venuePhoto(venue) {
  const title = VENUE_WIKI[venue];
  if (!title) return null;
  const key = 'wimg2:' + title;   // v2 key: v1 cached broken URLs
  try {
    const c = localStorage.getItem(key);
    if (c === 'x') return null;           // negative cache
    if (c) return JSON.parse(c);
  } catch(e){}
  try {
    const r = await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=800&format=json&origin=*&redirects=1&titles=' + encodeURIComponent(title));
    if (!r.ok) throw 0;
    const j = await r.json();
    const page = j.query && j.query.pages && Object.values(j.query.pages)[0];
    const src = page && page.thumbnail && page.thumbnail.source;
    if (!src) throw 0;
    const out = { src, page: 'https://en.wikipedia.org/wiki/' + encodeURIComponent(title) };
    try { localStorage.setItem(key, JSON.stringify(out)); } catch(e){}
    return out;
  } catch(e) {
    try { localStorage.setItem(key, 'x'); } catch(_){}
    return null;
  }
}

// ═══ VENUE STAT GUIDE ═══════════════════════════════════════════════
// A DeadBase-style venue index (dates played, show counts, song-frequency
// tables), computed from the local archive so it works offline.

// Buildings the band played under more than one name. Merged the way DeadBase
// treats them: one venue, noted with its former name.
const VENUE_RENAME = {
  "Oakland Auditorium Arena": "Henry J. Kaiser Convention Center"
};

// Venue identity is name + city: "Fox Theater" is two different buildings
// (St. Louis and Atlanta), while "Fox Theater"/"Fox Theatre" in St. Louis is one.
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '');
const venueName = s => VENUE_RENAME[s.venue] || s.venue;
const venueKey = s => slug(venueName(s)) + '|' + slug(s.city);

// The scrape pulls in page furniture alongside the songs — lineup credits
// ("Bass: Phil Lesh"), site chrome ("Comment on this Show!") and fan comments.
// Strip the decorations off real titles, then drop everything that isn't one.
const cleanSong = s => s
  .replace(/^E:\s*/i, '')              // encore marker
  .replace(/\s+\d{1,2}:\d{2}$/, '')    // track time copied from a tracklist
  .replace(/[>\s]+$/, '')              // segue arrow
  .trim();
const NOT_A_SONG = /!!|:\s|:\s*$|^[.(]|,.*!$|^\S+(\s+\S+){4,}\.$|copyright|setlist|compliments of|questions\/comments|comment on this show|^band (name|config)/i;
const isRealSong = s => {
  const n = cleanSong(s);
  return n.length > 1 && n.length <= 44 && !NOT_A_SONG.test(n);
};

const SEGMENTS = new Set(['drums', 'space', 'tuning']);

// One record in the archive is provably not a setlist: 1965-04-01 Menlo College
// carries "Touch Of Grey" (1982), "Smells Like Teen Spirit" (1991) and the
// literal strings "Setlist:" and "Set 1" across four sets. Left in the browse
// lists — the date itself is plausible — but kept out of every statistic, since
// otherwise it hands a 1965 debut to two decades of later songs.
const SUSPECT = new Set(['1965-04-01']);
const suspectNote = date => SUSPECT.has(date)
  ? 'This entry’s setlist doesn’t match its date — it lists songs written years later. Shown as scraped, but left out of all song and venue statistics.'
  : null;

let _venues = null;
function venueIndex() {
  if (_venues) return _venues;
  const byKey = new Map();
  const firstSeen = new Map();   // song → { date, key } first appearance in the archive
  const songVenues = new Map();  // song → Set of venue keys
  const label = new Map();       // song → nicest display spelling
  const plays = new Map();       // song → total nights across the archive
  const songDates = new Map();   // song → [date] in chronological order

  // Chronological spine: lets us measure a gap in *shows*, not just in days.
  const chron = [...ALL].sort((a, b) => a.date.localeCompare(b.date));
  const ord = new Map();
  chron.forEach((s, i) => { if (!ord.has(s.date)) ord.set(s.date, i); });

  for (const s of chron) {
    const k = venueKey(s);
    let v = byKey.get(k);
    if (!v) byKey.set(k, v = { key: k, name: venueName(s), city: s.city, aka: new Set(), shows: [], songs: new Map() });
    if (s.venue !== v.name) v.aka.add(s.venue);
    v.shows.push(s);

    const seen = new Set();
    if (SUSPECT.has(s.date)) continue;   // counted as a show, not as a setlist
    for (const set of s.sets) for (const raw of set.songs) {
      if (!isRealSong(raw)) continue;
      const name = cleanSong(raw), id = name.toLowerCase();
      if (seen.has(id)) continue;            // count nights played, not reprises
      seen.add(id);
      // prefer Title Case spellings over sloppy ones
      if (!label.has(id) || (/[a-z] [A-Z]/.test(name) && !/[a-z] [a-z]/.test(name))) label.set(id, name);
      plays.set(id, (plays.get(id) || 0) + 1);
      v.songs.set(id, (v.songs.get(id) || 0) + 1);
      let sd = songDates.get(id);
      if (!sd) songDates.set(id, sd = []);
      sd.push(s.date);
      if (!firstSeen.has(id)) firstSeen.set(id, { date: s.date, key: k });
      let sv = songVenues.get(id);
      if (!sv) songVenues.set(id, sv = new Set());
      sv.add(k);
    }
  }

  const ranked = [...byKey.values()].sort((a, b) => b.shows.length - a.shows.length || a.name.localeCompare(b.name));
  ranked.forEach((v, i) => { v.rank = i + 1; });

  // Song leaderboard, so a song can report its standing the way a venue does.
  const songRank = new Map();
  [...plays.entries()]
    .filter(([id]) => !SEGMENTS.has(id))
    .sort((a, b) => b[1] - a[1] || label.get(a[0]).localeCompare(label.get(b[0])))
    .forEach(([id], i) => songRank.set(id, i + 1));

  _venues = { byKey, ranked, firstSeen, songVenues, label, plays, songDates, songRank,
              chron, ord, songTotal: songRank.size, total: byKey.size };
  return _venues;
}

// ─── SONG HISTORY ───
// A performance in context: how often, how long since, and whether this night
// is the debut, the last time, or a bust-out after a long absence.
const BUSTOUT_SHOWS = 50;   // shows skipped before a return counts as a bust-out

function songStats(id, date) {
  const ix = venueIndex();
  const dates = ix.songDates.get(id);
  if (!dates) return null;
  const i = dates.indexOf(date);
  const prev = i > 0 ? dates[i - 1] : null;
  const next = i >= 0 && i < dates.length - 1 ? dates[i + 1] : null;
  // Gap measured in shows the band played without it, which is how a bust-out is felt.
  const gapShows = prev ? (ix.ord.get(date) - ix.ord.get(prev) - 1) : null;
  const gapDays = prev ? Math.round((Date.parse(date + 'T00:00:00Z') - Date.parse(prev + 'T00:00:00Z')) / 864e5) : null;
  return {
    id, name: ix.label.get(id), dates,
    n: dates.length, nth: i + 1,
    rank: ix.songRank.get(id) || null, songTotal: ix.songTotal,
    first: dates[0], last: dates[dates.length - 1],
    prev, next, gapShows, gapDays,
    isDebut: i === 0, isLast: i === dates.length - 1,
    isOnly: dates.length === 1,
    isBustout: gapShows !== null && gapShows >= BUSTOUT_SHOWS,
    segment: SEGMENTS.has(id)
  };
}

// The short tag that rides alongside a song in the setlist.
function songTag(st) {
  if (!st || st.segment) return null;
  if (st.isOnly) return { t: 'only time played', c: 'only' };
  if (st.isDebut) return { t: 'debut', c: 'debut' };
  if (st.isLast) return { t: 'last ever', c: 'last' };
  if (st.isBustout) {
    const yrs = st.gapDays / 365.25;
    return { t: yrs >= 1 ? `back after ${yrs.toFixed(1)} years` : `back after ${st.gapShows} shows`, c: 'bust' };
  }
  return null;
}

// Consecutive nights, e.g. a five-night stand at the Garden.
function nightRuns(dates) {
  const out = [];
  let run = [dates[0]];
  for (let i = 1; i < dates.length; i++) {
    const gap = (Date.parse(dates[i] + 'T00:00:00Z') - Date.parse(run[run.length - 1] + 'T00:00:00Z')) / 864e5;
    if (gap === 1) run.push(dates[i]); else { out.push(run); run = [dates[i]]; }
  }
  out.push(run);
  return out;
}

function venueStats(show) {
  const ix = venueIndex();
  const v = ix.byKey.get(venueKey(show));
  const dates = v.shows.map(s => s.date);
  const runs = nightRuns(dates);
  const years = new Set(dates.map(d => d.slice(0, 4)));

  // Structural segments top the chart at literally every venue, which tells you
  // nothing about the room. Counted in the song total, left out of the table.
  const top = [...v.songs.entries()]
    .filter(([id]) => !SEGMENTS.has(id))
    .sort((a, b) => b[1] - a[1] || ix.label.get(a[0]).localeCompare(ix.label.get(b[0])))
    .slice(0, 8)
    .map(([id, n]) => ({ name: ix.label.get(id), n }));

  const debuts = [...v.songs.keys()]
    .filter(id => ix.firstSeen.get(id).key === v.key)
    .sort((a, b) => ix.plays.get(b) - ix.plays.get(a))
    .slice(0, 14)
    .map(id => ({ name: ix.label.get(id), n: ix.plays.get(id), date: ix.firstSeen.get(id).date }));

  const exclusive = [...v.songs.keys()]
    .filter(id => ix.songVenues.get(id).size === 1)
    .sort((a, b) => ix.plays.get(b) - ix.plays.get(a))
    .slice(0, 14)
    .map(id => ({ name: ix.label.get(id), n: ix.plays.get(id) }));

  return {
    v, dates, years,
    rank: v.rank, venueCount: ix.total,
    longestRun: Math.max(...runs.map(r => r.length)),
    runCount: runs.length,
    distinct: v.songs.size,
    top, debuts, exclusive
  };
}

// ─── LINEUP ───
// Who was on stage. Spans are month-accurate, not day-accurate — the exact
// joining date is disputed for several members — so the UI says "around".
// Milestones below are derived from this archive, not asserted from the spans.
const LINEUP = [
  { n: 'Jerry Garcia',           r: 'lead guitar, vocals',     s: [['1965-05-01', '1995-07-09']] },
  { n: 'Bob Weir',               r: 'rhythm guitar, vocals',   s: [['1965-05-01', '1995-07-09']] },
  { n: 'Phil Lesh',              r: 'bass, vocals',            s: [['1965-06-01', '1995-07-09']] },
  { n: 'Bill Kreutzmann',        r: 'drums',                   s: [['1965-05-01', '1995-07-09']] },
  { n: 'Ron "Pigpen" McKernan',  r: 'organ, harp, vocals',     s: [['1965-05-01', '1972-06-30']] },
  { n: 'Mickey Hart',            r: 'drums',                   s: [['1967-09-01', '1971-02-28'], ['1974-10-01', '1995-07-09']] },
  { n: 'Tom Constanten',         r: 'keyboards',               s: [['1968-11-01', '1970-01-31']] },
  { n: 'Keith Godchaux',         r: 'keyboards',               s: [['1971-10-01', '1979-02-28']] },
  { n: 'Donna Jean Godchaux',    r: 'vocals',                  s: [['1972-03-01', '1979-02-28']] },
  { n: 'Brent Mydland',          r: 'keyboards, vocals',       s: [['1979-04-01', '1990-07-31']] },
  { n: 'Vince Welnick',          r: 'keyboards, vocals',       s: [['1990-09-01', '1995-07-09']] },
  { n: 'Bruce Hornsby',          r: 'piano, accordion',        s: [['1990-09-01', '1992-03-31']] }
];

const lineupOn = date => LINEUP.filter(m => m.s.some(([a, b]) => date >= a && date <= b));

// First and last night each member actually appears in this archive. Derived,
// so the app never claims a farewell show it doesn't hold.
let _milestones = null;
function milestones() {
  if (_milestones) return _milestones;
  const chron = venueIndex().chron;
  const m = new Map();   // date → [text]
  for (const mem of LINEUP) {
    mem.s.forEach(([a, b], si) => {
      const inSpan = chron.filter(s => s.date >= a && s.date <= b);
      if (!inSpan.length) return;
      const first = inSpan[0].date, last = inSpan[inSpan.length - 1].date;
      const rejoin = si > 0;
      const leaves = b < '1995-07-09';
      const push = (d, t) => { if (!m.has(d)) m.set(d, []); if (!m.get(d).includes(t)) m.get(d).push(t); };
      if (a > '1965-05-01') push(first, `${mem.n}'s ${rejoin ? 'first night back' : 'first night here'}`);
      if (leaves) push(last, `${mem.n}'s last night here`);
    });
  }
  _milestones = m;
  return _milestones;
}

// ─── RUNS AND LEGS ───
const LEG_GAP = 6;   // days off before a stretch of dates reads as a separate leg

// Night 2 of 3 at the Garden.
function showRun(show) {
  const v = venueIndex().byKey.get(venueKey(show));
  if (!v) return null;
  const run = nightRuns(v.shows.map(s => s.date)).find(r => r.includes(show.date));
  if (!run || run.length < 2) return null;
  return { night: run.indexOf(show.date) + 1, of: run.length, dates: run };
}

// The surrounding stretch of touring — consecutive dates with no long break.
let _legs = null;
function legIndex() {
  if (_legs) return _legs;
  const chron = venueIndex().chron;
  const legs = [];
  let cur = [chron[0]];
  for (let i = 1; i < chron.length; i++) {
    const gap = (Date.parse(chron[i].date + 'T00:00:00Z') - Date.parse(cur[cur.length - 1].date + 'T00:00:00Z')) / 864e5;
    if (gap <= LEG_GAP) cur.push(chron[i]); else { legs.push(cur); cur = [chron[i]]; }
  }
  legs.push(cur);
  const byDate = new Map();
  legs.forEach(leg => leg.forEach((s, i) => byDate.set(s.date, { n: i + 1, of: leg.length, leg })));
  _legs = byDate;
  return _legs;
}

function showLeg(show) {
  const l = legIndex().get(show.date);
  return l && l.of >= 3 ? l : null;
}

// ─── ARCHIVE.ORG: what recordings exist for a date, and what kind ───
// Lineage is the tapers' shorthand for how a recording was made, and it's the
// single biggest predictor of how a show sounds. Archive.org doesn't expose it
// as a clean field, so it's read off the identifier and title the way a
// collector reads a folder name.
function lineage(d) {
  const t = ((d.identifier || '') + ' ' + (d.title || '')).toLowerCase();
  if (/matrix|\bmtx\b/.test(t))                  return { k: 'MATRIX', w: 2.2, d: 'Soundboard and audience mixed together' };
  if (/\bsbd\b|soundboard|\bsdb\b/.test(t))      return { k: 'SBD',    w: 2.5, d: 'Straight off the mixing desk' };
  if (/\bfm\b|broadcast|\bkpfa\b|\bwnew\b/.test(t)) return { k: 'FM',  w: 2.0, d: 'Off a radio broadcast' };
  if (/\baud\b|audience/.test(t))                return { k: 'AUD',    w: 1.0, d: 'Taped from the crowd' };
  return { k: '—', w: 1.2, d: 'Lineage not stated' };
}

const BETTY = /betty|miller|charlie|bertha|gems|vault/i;

async function recordings(date) {
  const key = 'rec1:' + date;
  try { const c = localStorage.getItem(key); if (c) return JSON.parse(c); } catch (e) {}

  const q = encodeURIComponent(`collection:GratefulDead AND date:${date}`);
  const fl = ['identifier', 'title', 'avg_rating', 'num_reviews', 'downloads'].map(f => 'fl[]=' + f).join('&');
  const r = await fetch(`https://archive.org/advancedsearch.php?q=${q}&${fl}&rows=100&page=1&output=json`);
  if (!r.ok) throw new Error('archive search failed');
  const docs = (await r.json()).response.docs || [];

  const list = docs.map(d => {
    const ln = lineage(d);
    const rating = parseFloat(d.avg_rating) || 0;
    const reviews = parseInt(d.num_reviews) || 0;
    const downloads = parseInt(d.downloads) || 0;
    return {
      id: d.identifier, title: d.title || d.identifier,
      kind: ln.k, kindNote: ln.d, noted: BETTY.test(d.identifier + ' ' + (d.title || '')),
      rating, reviews, downloads,
      // Ranking mirrors how people actually choose: lineage first, then the
      // crowd's verdict, with downloads as a weak tiebreak.
      score: ln.w + rating * .6 + Math.log10(downloads + 1) * .35 + (BETTY.test(d.identifier) ? .5 : 0)
    };
  }).sort((a, b) => b.score - a.score);

  const out = { list, count: list.length };
  try { localStorage.setItem(key, JSON.stringify(out)); } catch (e) {}
  return out;
}

async function bestRecording(date) {
  const { list, count } = await recordings(date);
  return list.length ? { id: list[0].id, count } : null;
}

// ─── SEARCH ───
let _srchRes = [];
function runSearch(q) {
  const el = document.getElementById('srch-list');
  const hint = document.getElementById('srch-hint');
  q = q.trim().toLowerCase();
  if (q.length < 2) { el.innerHTML=''; hint.textContent='Try “Scarlet Begonias”, “Red Rocks”, or “1977”'; return; }
  const res = [];
  for (const s of ALL) {
    let match = null;
    if (s.venue.toLowerCase().includes(q) || s.city.toLowerCase().includes(q) || s.date.includes(q) || fmtL(s.date).toLowerCase().includes(q)) {
      match = '';
    } else {
      outer: for (const st of s.sets) for (const song of st.songs) {
        if (song.toLowerCase().includes(q)) { match = song; break outer; }
      }
    }
    if (match !== null) { res.push({s, match}); if (res.length >= 120) break; }
  }
  _srchRes = res;
  hint.textContent = res.length ? `${res.length}${res.length>=120?'+':''} show${res.length>1?'s':''} found` : 'Nothing found — try fewer words';
  el.innerHTML = res.map((r,i)=>rowHTML(r.s, i, r.match)).join('');
  el.querySelectorAll('.show-row').forEach(r=>{
    r.onclick=()=>navShow(_srchRes[+r.dataset.i].s, true);
  });
}
let _deb;
document.getElementById('srch-in').addEventListener('input', e=>{
  clearTimeout(_deb); _deb = setTimeout(()=>runSearch(e.target.value), 160);
});

// ─── SHOW DETAIL ───
function renderShowDetail(s) {
  const nShows = (venueIndex().byKey.get(venueKey(s)) || {shows:[s]}).shows.length;
  const run = showRun(s), leg = showLeg(s), band = lineupOn(s.date), marks = milestones().get(s.date) || [];

  const flagged = suspectNote(s.date);
  const setHTML = s.sets.map(set=>{
    const songs = set.songs.map((song,i)=>{
      const real = isRealSong(song) && !flagged;
      const id = real ? cleanSong(song).toLowerCase() : null;
      const st = id ? songStats(id, s.date) : null;
      const tag = songTag(st);
      return `
      <div class="song-row${st ? ' tapd' : ''}"${st ? ` data-song="${esc(id)}"` : ''}>
        <span class="sn">${set.enc?'':i+1}</span>
        <span class="s${isHi(song)?' hi':''}${set.enc?' en':''}">${song}${tag?`<span class="tag ${tag.c}">${tag.t}</span>`:''}</span>
        ${st && !st.segment ? `<span class="sx">${st.n}</span>` : ''}
      </div>`;
    }).join('');
    return `<div class="set-block"><div class="set-lbl${set.enc?' enc':''}">${set.lbl}</div>${songs}</div>`;
  }).join('');

  const ctx = [];
  if (run) ctx.push(`Night ${run.night} of ${run.of}`);
  if (leg) ctx.push(`Show ${leg.n} of ${leg.of} on this stretch`);
  if (leg) ctx.push(`${fmtS(leg.leg[0].date)} → ${fmtS(leg.leg[leg.leg.length-1].date)}`);

  document.getElementById('show-content').innerHTML = `
    <div class="show-hero" style="--era-color:${s.era.color}">
      <div class="hero-photo" id="hero-photo"></div>
      <div class="hero-tint"></div>
      <a class="photo-cred" id="photo-cred" target="_blank" rel="noopener">Photo · Wikipedia</a>
      <div class="sh-c">
        <div class="sh-date">${fmtL(s.date)}</div>
        <div class="sh-dow">${s.dow}</div>
        <div class="sh-venue-big">${s.venue}</div>
        <div class="sh-city-big">${s.city}</div>
        <div class="sh-era-lbl">${s.era.name} · ${s.era.years}</div>
        ${marks.map(m=>`<div class="sh-badge-big">${esc(m)}</div>`).join('')}
        ${ctx.length?`<div class="sh-ctx">${ctx.map(c=>`<span>${c}</span>`).join('')}</div>`:''}
        <button class="venue-btn" id="venue-btn"><span class="vb-i">◎</span>Venue guide${nShows>1?` · ${nShows} shows here`:''}</button>
      </div>
    </div>
    ${band.length?`<div class="band-blk">
      <div class="band-lbl">On stage</div>
      <div class="band-list">${band.map(m=>`<span class="band-m">${esc(m.n)}<b>${esc(m.r)}</b></span>`).join('')}</div>
      <div class="band-note">Lineup by date, month-accurate — several joining dates are disputed.</div>
    </div>`:''}
    <div class="player-blk" id="player-blk">
      <button class="play-btn" id="play-btn"><span class="tri">▶</span><span>Play this show</span></button>
    </div>
    <div class="setlist-wrap">
      ${flagged?`<div class="sus">${flagged}</div>`:''}
      ${setHTML}
      <div class="rec-blk" id="rec-blk"></div>
      <div class="sh-footer">
        <div class="sh-ft-src">Source: setlists.net · Show ID #${s.id}</div>
        <div class="sh-ft-btns">
          <a class="arch-btn" href="${archUrl(s.date)}" target="_blank" rel="noopener"><span>Archive.org ↗</span></a>
          <a class="arch-btn" href="${slUrl(s.id)}" target="_blank" rel="noopener"><span>setlists.net ↗</span></a>
        </div>
      </div>
    </div>`;

  document.getElementById('venue-btn').onclick = () => openVenueSheet(s);
  document.querySelectorAll('#show-content .song-row.tapd').forEach(r => {
    r.onclick = () => openSongSheet(r.dataset.song, s);
  });

  // Recordings (async — the archive is the one thing here that isn't local)
  const recBlk = document.getElementById('rec-blk');
  recordings(s.date).then(({ list, count }) => {
    if (!recBlk.isConnected) return;   // navigated away
    if (!count) { recBlk.innerHTML = `<div class="rec-none">No recordings catalogued on Archive.org for this date.</div>`; return; }
    const top = list.slice(0, 6);
    recBlk.innerHTML = `
      <div class="set-lbl rec">Recordings · ${count} on Archive.org</div>
      ${top.map(r => `
        <a class="rec-row" href="https://archive.org/details/${encodeURIComponent(r.id)}" target="_blank" rel="noopener">
          <span class="rec-k k-${r.kind.toLowerCase().replace(/[^a-z]/g, '') || 'x'}" title="${esc(r.kindNote)}">${r.kind}</span>
          <span class="rec-t">${esc(r.title)}${r.noted ? '<b>noted source</b>' : ''}</span>
          <span class="rec-m">${r.rating ? `★ ${r.rating.toFixed(1)}` : '—'}<i>${r.downloads.toLocaleString()}</i></span>
        </a>`).join('')}
      ${count > top.length ? `<a class="rec-all" href="${archUrl(s.date)}" target="_blank" rel="noopener">All ${count} recordings ↗</a>` : ''}
      <div class="rec-note">SBD is off the mixing desk, AUD from the crowd, MATRIX the two mixed. Read from the file names, so treat it as a strong hint rather than a guarantee.</div>`;
  }).catch(() => {
    if (recBlk.isConnected) recBlk.innerHTML = `<div class="rec-none">Couldn't reach Archive.org for the recording list.</div>`;
  });

  // venue photo (async, graceful fallback to era art)
  venuePhoto(s.venue).then(p=>{
    if (!p) return;
    const ph = document.getElementById('hero-photo'), cr = document.getElementById('photo-cred');
    if (!ph) return; // user already navigated away
    const img = new Image();
    img.onload = () => { ph.style.backgroundImage = `url("${p.src}")`; ph.classList.add('on'); cr.href = p.page; cr.classList.add('on'); };
    img.src = p.src;
  });

  // inline player (on demand)
  const btn = document.getElementById('play-btn');
  btn.onclick = async () => {
    btn.disabled = true;
    btn.querySelector('span:last-child').textContent = 'Finding best recording…';
    const blk = document.getElementById('player-blk');
    try {
      const rec = await bestRecording(s.date);
      if (!rec) throw new Error('none');
      blk.innerHTML = `
        <div class="player-frame"><iframe src="https://archive.org/embed/${rec.id}?playlist=1&list_height=280" allow="autoplay; encrypted-media" loading="lazy" title="Grateful Dead ${s.date} — Archive.org player"></iframe></div>
        <div class="player-meta">Best of ${rec.count} recording${rec.count>1?'s':''} on Archive.org · <a href="${archUrl(s.date)}" target="_blank" rel="noopener">See all ↗</a></div>`;
    } catch(e) {
      blk.innerHTML = `<div class="player-err">Couldn't reach Archive.org — <a href="${archUrl(s.date)}" target="_blank" rel="noopener">open recordings in a new tab ↗</a></div>`;
    }
  };
}

// ─── NAV ───
const $home = document.getElementById('home');
const $list = document.getElementById('list-view');
const $show = document.getElementById('show-view');
let _showBack = 'list';
let _curShow = null;

function navList(title, sub, shows) {
  document.getElementById('list-t').textContent = title;
  document.getElementById('list-s').textContent = sub;
  renderShowList(shows);
  $list.scrollTop = 0;
  $home.classList.add('l');
  $list.classList.remove('r','l');
  $show.classList.add('r'); $show.classList.remove('l');
}

function navShow(s, fromHome=false) {
  _curShow = s;
  renderShowDetail(s);
  document.getElementById('show-t').textContent = s.venue;
  document.getElementById('show-s').textContent = fmtL(s.date);
  document.getElementById('nav-venue').hidden = false;
  $show.scrollTop = 0;
  _showBack = fromHome ? 'home' : 'list';
  if (fromHome) { $home.classList.add('l'); $list.classList.add('r'); }
  else { $list.classList.add('l'); $list.classList.remove('r'); }
  $show.classList.remove('r','l');
}

document.getElementById('list-back').onclick = () => {
  $list.classList.add('r'); $list.classList.remove('l');
  $home.classList.remove('l');
};
document.getElementById('show-back').onclick = () => {
  closeVenueSheet();
  $show.classList.add('r');
  if (_showBack === 'home') {
    $home.classList.remove('l');
    $list.classList.add('r'); $list.classList.remove('l');
  } else {
    $list.classList.remove('l','r');
  }
};

// Tabs
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.tp').forEach(p=>p.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('tp-'+btn.dataset.tp).classList.add('on');
    if (btn.dataset.tp==='srch') document.getElementById('srch-in').focus();
  };
});

// Random show
document.getElementById('rand-btn').onclick = () => {
  if (!ALL.length) return;
  navShow(ALL[Math.floor(Math.random()*ALL.length)], true);
};

// ─── INIT: load data, then render ───
async function boot() {
  try {
    const r = await fetch('shows-data.json');
    if (!r.ok) throw new Error(r.status);
    ERAS = await r.json();
    ALL = ERAS.flatMap(e => e.shows.map(s => ({...s, era:e})));
    YR_MAP = {};
    ALL.forEach(s => { const y = s.date.slice(0,4); (YR_MAP[y] = YR_MAP[y]||[]).push(s); });
    renderSOTD();
    renderEras();
    renderYears();
  } catch(e) {
    document.getElementById('sotd').innerHTML =
      `<div class="load-err">Couldn't load the shows.<br><button onclick="location.reload()">Retry</button></div>`;
  }
}
boot();

// ─── PWA ───
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
